<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sant'Ana Solar - Plataforma Profissional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f9fafb; }
    .card { background: white; border-radius: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.06); padding: 1.5rem; }
    .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-align: center; }
    .btn-primary { background: #facc15; color: #1f2937; } .btn-primary:hover { background: #eab308; transform: scale(1.03); }
    .btn-secondary { background: #e5e7eb; color: #374151; } .btn-secondary:hover { background: #d1d5db; }
    .btn-success { background: #22c55e; color: white; } .btn-success:hover { background: #16a34a; }
    .input-field { width: 100%; border: 1px solid #d1d5db; border-radius: 0.75rem; padding: 0.75rem; outline: none; background: white; }
    .input-field:focus { border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,0.2); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f8fafc; font-weight: 600; }
    #mapa { height: 400px; width: 100%; border-radius: 1rem; }
    .chat-container { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .chat-bubble { max-width: 80%; padding: 0.5rem 1rem; border-radius: 1rem; animation: fadeIn 0.3s; }
    .chat-bot { background: #f3f4f6; align-self: flex-start; }
    .chat-user { background: #facc15; align-self: flex-end; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-gray-50 to-gray-100">
  <div id="app" class="w-full max-w-6xl mx-auto"></div>

  <script>
    // ============================================================
    // SANT'ANA SOLAR - IRRADIAÇÃO REAL POR COORDENADAS
    // ============================================================
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const DIAS_MES = [31,28,31,30,31,30,31,31,30,31,30,31];
    const POTENCIA_MODULO_KW = 0.55;
    const CUSTO_POR_WP_PADRAO = 3.20;
    const PR_PADRAO = 0.78;
    const TAXA_DESCONTO_PADRAO = 0.10;
    const DEGRADACAO_ANUAL = 0.005;
    const ANOS_ANALISE = 25;
    const TAXA_MINIMA = { monofasico: 30, bifasico: 50, trifasico: 100 };

    // ============================================================
    // NOVA FUNÇÃO: Obter irradiação real via Open-Meteo (grátis)
    // ============================================================
    async function obterIrradiacaoReal(lat, lon) {
      const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2022-01-01&end_date=2022-12-31&daily=shortwave_radiation_sum&timezone=America/Sao_Paulo`;
      const resp = await fetch(url);
      const data = await resp.json();
      // shortwave_radiation_sum = Wh/m²/dia → converter para kWh/m²/dia
      const irradDiaria = data.daily.shortwave_radiation_sum.map(v => +(v / 1000).toFixed(2));
      // Agrupar por mês e calcular média mensal
      const irradMensal = MESES.map((_, i) => {
        const mesInicio = new Date(2022, i, 1);
        const mesFim = new Date(2022, i + 1, 0);
        const diasMes = mesFim.getDate();
        const inicioIdx = data.daily.time.indexOf(`2022-${String(i+1).padStart(2,'0')}-01`);
        const valores = irradDiaria.slice(inicioIdx, inicioIdx + diasMes);
        const media = valores.reduce((a,b)=>a+b,0) / valores.length;
        return +media.toFixed(2);
      });
      const hspAnual = +(irradMensal.reduce((a,b)=>a+b,0) / 12).toFixed(2);
      return { irradMensal, hspAnual };
    }

    // Fallback: se a API falhar, usa tabela de capitais (mantida para contingência)
    const CAPITAIS = {
      'Aracaju': { uf:'SE', lat:-10.95, lon:-37.07, hsp:5.3 },
      'São Paulo': { uf:'SP', lat:-23.55, lon:-46.63, hsp:4.8 },
      // ... (manter todas as 27 capitais como fallback)
    };

    function gerarIrradiacaoMensalFallback(hspAnual, lat) {
      const absLat = Math.abs(lat);
      let amplitude = 0.15;
      if (absLat >= 5 && absLat < 15) amplitude = 0.25;
      else if (absLat >= 15 && absLat < 23) amplitude = 0.40;
      else if (absLat >= 23) amplitude = 0.60;
      return MESES.map((_, i) => {
        const dist = lat < 0 ? Math.min(i, 12 - i) : Math.abs(i - 5.5);
        return +(hspAnual * (1 + amplitude * Math.cos(dist * Math.PI / 6))).toFixed(2);
      });
    }

    // ============================================================
    // CÁLCULO DO SISTEMA COM HISTÓRICO DE 12 MESES
    // ============================================================
    function calcularSistemaDetalhado(params) {
      const { consumoHistorico, tarifa, irradMensal, performanceRatio = PR_PADRAO, custoPorWp = CUSTO_POR_WP_PADRAO, tipoLigacao = 'monofasico', taxaDesconto = TAXA_DESCONTO_PADRAO } = params;
      const consumoMedio = consumoHistorico.reduce((a,b)=>a+b,0) / 12;
      const hspMedio = irradMensal.reduce((a,b)=>a+b,0) / 12;
      const consumoDiario = consumoMedio / 30;
      const energiaNecessaria = consumoDiario / performanceRatio;
      const potenciaPico = energiaNecessaria / hspMedio;
      const numeroModulos = Math.ceil(potenciaPico / POTENCIA_MODULO_KW);
      const potenciaReal = numeroModulos * POTENCIA_MODULO_KW;
      const geracaoMensal = irradMensal.map((irr, i) => +(potenciaReal * irr * DIAS_MES[i] * performanceRatio).toFixed(2));
      const taxaMinima = TAXA_MINIMA[tipoLigacao] || TAXA_MINIMA.monofasico;
      const economiasAnuais = [];
      let creditoAcumulado = 0;
      for (let ano = 1; ano <= ANOS_ANALISE; ano++) {
        let economiaAnual = 0;
        for (let mes = 0; mes < 12; mes++) {
          const geracao = geracaoMensal[mes] * Math.pow(1 - DEGRADACAO_ANUAL, ano - 1);
          const consumo = consumoHistorico[mes];
          const saldo = geracao - consumo;
          if (saldo >= 0) {
            creditoAcumulado += saldo;
            economiaAnual += (consumo - Math.min(consumo, taxaMinima)) * tarifa;
          } else {
            const deficit = -saldo;
            const usadoCredito = Math.min(creditoAcumulado, deficit);
            creditoAcumulado -= usadoCredito;
            economiaAnual += (geracao + usadoCredito - Math.min(geracao + usadoCredito, taxaMinima)) * tarifa;
          }
        }
        economiasAnuais.push(economiaAnual);
      }
      const investimento = +(potenciaReal * 1000 * custoPorWp).toFixed(2);
      let acumulado = 0, payback = ANOS_ANALISE;
      for (let ano = 0; ano < ANOS_ANALISE; ano++) {
        acumulado += economiasAnuais[ano];
        if (acumulado >= investimento) {
          payback = ano + (1 - (acumulado - investimento) / economiasAnuais[ano]);
          break;
        }
      }
      payback = +payback.toFixed(1);
      let vpl = -investimento;
      for (let ano = 0; ano < ANOS_ANALISE; ano++) {
        vpl += economiasAnuais[ano] / Math.pow(1 + taxaDesconto, ano + 1);
      }
      vpl = +vpl.toFixed(2);
      const econMensal = +(economiasAnuais[0] / 12).toFixed(2);
      let inversor = 'Inversor 5kW Monofásico 220V';
      if (potenciaReal > 5.5 && potenciaReal <= 8) inversor = 'Inversor 8kW Trifásico 380V';
      else if (potenciaReal > 8) inversor = 'Inversor 10kW Trifásico 380V';
      const bom = [
        { item:'Painel Solar 550W Mono PERC', qtd:numeroModulos, un:'un' },
        { item:inversor, qtd:1, un:'un' },
        { item:'Cabo solar 4mm²', qtd:Math.ceil(numeroModulos*1.5)*2, un:'m' },
        { item:'Conectores MC4', qtd:Math.ceil(numeroModulos/2)*2, un:'pares' },
        { item:'String Box CC', qtd:1, un:'un' },
        { item:'Disjuntor CA', qtd:1, un:'un' },
        { item:'Kit aterramento', qtd:1, un:'kit' },
        { item:'Estrutura fixação', qtd:numeroModulos, un:'ganchos' },
        { item:'Trilho alumínio', qtd:Math.ceil(numeroModulos*1.2), un:'m' },
      ];
      return { irradMensal, consumoMedio, consumoHistorico, tarifa, tipoLigacao, performanceRatio, taxaDesconto, taxaMinima, potenciaReal, numeroModulos, inversor, investimento, geracaoMensal, economiasAnuais, econMensal, econAnual: economiasAnuais[0], payback, vpl, bom };
    }

    function calcularParcela(valor, prazoMeses, taxaJurosMensal) {
      const i = taxaJurosMensal / 100;
      if (i === 0) return +(valor / prazoMeses).toFixed(2);
      return +((valor * i) / (1 - Math.pow(1 + i, -prazoMeses))).toFixed(2);
    }

    async function buscarEnderecoPorCEP(cep) {
      const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data = await resp.json();
      if (data.erro) throw new Error('CEP não encontrado');
      return data;
    }

    async function buscarCoordenadas(endereco) {
      const query = `${endereco.logradouro}, ${endereco.localidade}, ${endereco.uf}, Brasil`;
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
      const data = await resp.json();
      if (data.length > 0) return { lat: +data[0].lat, lon: +data[0].lon };
      return null;
    }

    function inicializarMapa(containerId, lat, lon, aoDesenhar) {
      const mapa = L.map(containerId).setView([lat, lon], 20);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'OSM' }).addTo(mapa);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Esri' }).addTo(mapa);
      const drawnItems = new L.FeatureGroup();
      mapa.addLayer(drawnItems);
      const drawControl = new L.Control.Draw({
        draw: { polygon: true, polyline: false, rectangle: true, circle: false, marker: false },
        edit: { featureGroup: drawnItems }
      });
      mapa.addControl(drawControl);
      mapa.on(L.Draw.Event.CREATED, (e) => {
        drawnItems.clearLayers();
        const layer = e.layer;
        drawnItems.addLayer(layer);
        const coordenadas = layer.getLatLngs()[0];
        const area = L.GeometryUtil.geodesicArea(coordenadas);
        const azimute = calcularAzimute(coordenadas[0], coordenadas[1]);
        aoDesenhar({ area: +area.toFixed(2), azimute: +azimute.toFixed(1), coordenadas });
      });
      return mapa;
    }

    function calcularAzimute(p1, p2) {
      const [lat1, lon1] = [p1.lat * Math.PI/180, p1.lng * Math.PI/180];
      const [lat2, lon2] = [p2.lat * Math.PI/180, p2.lng * Math.PI/180];
      const dLon = lon2 - lon1;
      const y = Math.sin(dLon) * Math.cos(lat2);
      const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
      let az = Math.atan2(y, x) * 180/Math.PI;
      return (az + 360) % 360;
    }

    const app = document.getElementById('app');

    // ========== TELA INICIAL ==========
    function telaInicial() {
      app.innerHTML = `
        <div class="text-center space-y-8 max-w-lg mx-auto">
          <h1 class="text-4xl font-bold">☀️ Sant'Ana Solar</h1>
          <p class="text-gray-600">Escolha como deseja simular:</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card cursor-pointer hover:shadow-xl transition" id="chatbotOption">
              <div class="text-4xl">🤖</div>
              <h3 class="text-xl font-semibold mt-2">Assistente Virtual</h3>
              <p class="text-sm text-gray-500">Responda perguntas e receba um projeto personalizado.</p>
            </div>
            <div class="card cursor-pointer hover:shadow-xl transition" id="manualOption">
              <div class="text-4xl">⚙️</div>
              <h3 class="text-xl font-semibold mt-2">Simulação Manual</h3>
              <p class="text-sm text-gray-500">Preencha os dados e desenhe seu telhado no mapa.</p>
            </div>
          </div>
        </div>`;
      document.getElementById('chatbotOption').addEventListener('click', iniciarChatbot);
      document.getElementById('manualOption').addEventListener('click', telaFormularioManual);
    }

    // ========== SIMULAÇÃO MANUAL (com CEP + histórico) ==========
    function telaFormularioManual() {
      let usandoHistorico = false;
      const renderForm = () => {
        const htmlConsumo = usandoHistorico
          ? MESES.map((m, i) => `<div><label class="text-xs">${m}</label><input id="cons_${i}" type="number" value="${i===0?450:i===11?550:500}" class="input-field"></div>`).join('')
          : `<div><label class="text-sm font-medium">Consumo médio (kWh/mês)</label><input id="consumoMedio" type="number" value="500" class="input-field"></div>`;
        return `
          <div class="text-center space-y-6 max-w-lg mx-auto">
            <h2 class="text-2xl font-bold">Simulação Manual</h2>
            <div class="card space-y-4">
              <div><label class="text-sm font-medium">CEP</label><input id="cepInput" type="text" maxlength="8" class="input-field" placeholder="01001000"></div>
              <div id="areaConsumo">${htmlConsumo}
                <button id="toggleHistorico" class="text-sm text-blue-600 underline mt-2">${usandoHistorico ? 'Usar média simples' : 'Usar histórico dos últimos 12 meses'}</button>
              </div>
              <div><label class="text-sm font-medium">Tarifa (R$/kWh)</label><input id="tarifaInput" type="number" value="0.90" step="0.01" class="input-field"></div>
              <div><label class="text-sm font-medium">Tipo de ligação</label><select id="ligacaoSelect" class="input-field"><option value="monofasico">Monofásico</option><option value="bifasico">Bifásico</option><option value="trifasico">Trifásico</option></select></div>
              <button id="avancarBtn" class="btn btn-primary w-full">Avançar para o Mapa</button>
              <button id="voltarBtn" class="btn btn-secondary w-full">Voltar</button>
            </div>
          </div>`;
      };

      const atualizarTela = () => { app.innerHTML = renderForm(); bindEvents(); };
      const bindEvents = () => {
        document.getElementById('toggleHistorico').addEventListener('click', (e) => {
          e.preventDefault();
          usandoHistorico = !usandoHistorico;
          atualizarTela();
        });
        document.getElementById('voltarBtn').addEventListener('click', telaInicial);
        document.getElementById('avancarBtn').addEventListener('click', async () => {
          const cep = document.getElementById('cepInput').value.trim();
          if (cep.length !== 8) return alert('Digite um CEP válido.');
          const tarifa = +document.getElementById('tarifaInput').value;
          const tipoLigacao = document.getElementById('ligacaoSelect').value;
          let consumoHistorico;
          if (usandoHistorico) {
            consumoHistorico = MESES.map((_, i) => +document.getElementById(`cons_${i}`).value);
          } else {
            const media = +document.getElementById('consumoMedio').value;
            consumoHistorico = Array(12).fill(media);
          }
          try {
            const endereco = await buscarEnderecoPorCEP(cep);
            const coords = await buscarCoordenadas(endereco);
            if (!coords) return alert('Não foi possível encontrar as coordenadas do endereço.');
            telaMapa(coords, { consumoHistorico, tarifa, tipoLigacao, endereco, cep });
          } catch (e) {
            alert('Erro ao buscar CEP. Tente novamente.');
          }
        });
      };

      app.innerHTML = renderForm();
      bindEvents();
    }

    function telaMapa(coords, dadosParciais) {
      app.innerHTML = `
        <div class="space-y-4 max-w-4xl mx-auto">
          <h2 class="text-2xl font-bold">🗺️ Desenhe seu telhado</h2>
          <p class="text-gray-600">Use a ferramenta de polígono para contornar o telhado.</p>
          <div id="mapa" style="height:400px; border-radius:1rem;"></div>
          <div id="infoTelhado" class="card hidden"><strong>Área:</strong> <span id="areaTelhado"></span> m² | <strong>Orientação:</strong> <span id="azimuteTelhado"></span>°</div>
          <button id="calcularBtn" class="btn btn-primary w-full" disabled>Calcular Sistema</button>
          <button id="voltarBtn" class="btn btn-secondary w-full">Voltar</button>
        </div>`;
      const aoDesenhar = (info) => {
        document.getElementById('infoTelhado').classList.remove('hidden');
        document.getElementById('areaTelhado').textContent = info.area;
        document.getElementById('azimuteTelhado').textContent = info.azimute;
        document.getElementById('calcularBtn').disabled = false;
        dadosParciais.telhado = info;
      };
      inicializarMapa('mapa', coords.lat, coords.lon, aoDesenhar);
      document.getElementById('voltarBtn').addEventListener('click', telaInicial);
      document.getElementById('calcularBtn').addEventListener('click', async () => {
        try {
          const { irradMensal } = await obterIrradiacaoReal(coords.lat, coords.lon);
          const resultado = calcularSistemaDetalhado({ ...dadosParciais, irradMensal });
          resultado.endereco = `${dadosParciais.endereco.logradouro}, ${dadosParciais.endereco.bairro} - ${dadosParciais.endereco.localidade}/${dadosParciais.endereco.uf}`;
          resultado.coords = coords;
          telaResultado(resultado);
        } catch (e) {
          alert('Erro ao obter dados de irradiação. Usando estimativa local.');
          // Fallback com base na latitude
          const hspEstimado = Math.max(4.0, 6.0 - Math.abs(coords.lat) * 0.05);
          const irradMensal = gerarIrradiacaoMensalFallback(hspEstimado, coords.lat);
          const resultado = calcularSistemaDetalhado({ ...dadosParciais, irradMensal });
          resultado.endereco = `${dadosParciais.endereco.logradouro}, ${dadosParciais.endereco.bairro} - ${dadosParciais.endereco.localidade}/${dadosParciais.endereco.uf}`;
          resultado.coords = coords;
          telaResultado(resultado);
        }
      });
    }

    // ========== CHATBOT ==========
    function iniciarChatbot() {
      const state = { step: 0, answers: {}, messages: [] };
      const questions = [
        { id:'cep', question:'Qual o seu CEP? (só números)', type:'input', placeholder:'01001000', validate: v => /^\d{8}$/.test(v), error:'CEP deve ter 8 dígitos.' },
        { id:'historico', question:'Vamos usar o histórico dos últimos 12 meses? Digite os valores separados por vírgula (Jan a Dez).', type:'input', placeholder:'450,480,500,520,550,600,620,600,550,500,480,450', validate: v => v.split(',').length === 12 && v.split(',').every(n=>!isNaN(n)&&+n>0), error:'Digite exatamente 12 valores.' },
        { id:'tarifa', question:'Qual a tarifa de energia? (R$/kWh)', type:'input', placeholder:'0.90', validate: v => !isNaN(v) && +v > 0, error:'Valor inválido.' },
        { id:'ligacao', question:'Tipo de ligação?', type:'buttons', options:[{label:'Monofásico',value:'monofasico'},{label:'Bifásico',value:'bifasico'},{label:'Trifásico',value:'trifasico'}] },
        { id:'nome', question:'Seu nome:', type:'input', placeholder:'Nome completo', validate: v => v.trim().length > 0, error:'Obrigatório.' },
        { id:'email', question:'E-mail para proposta:', type:'input', placeholder:'email@exemplo.com', validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), error:'E-mail inválido.' }
      ];

      app.innerHTML = `
        <div class="max-w-2xl mx-auto card flex flex-col" style="height: 80vh;">
          <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">🤖 Assistente Sant'Ana</h2><button id="fecharChat" class="btn btn-secondary text-sm">Voltar</button></div>
          <div id="chatMessages" class="chat-container flex-1 p-2"></div>
          <div id="inputArea" class="mt-4"></div>
        </div>`;
      document.getElementById('fecharChat').addEventListener('click', telaInicial);
      const chatMessages = document.getElementById('chatMessages');
      const inputArea = document.getElementById('inputArea');

      function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `chat-bubble ${sender === 'bot' ? 'chat-bot' : 'chat-user'}`;
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function showQuestion(q) {
        addMessage(q.question, 'bot');
        inputArea.innerHTML = '';
        if (q.type === 'input') {
          const input = document.createElement('input');
          input.type = 'text'; input.placeholder = q.placeholder; input.className = 'input-field flex-1';
          const btn = document.createElement('button'); btn.textContent = 'Enviar'; btn.className = 'btn btn-primary ml-2';
          inputArea.appendChild(input); inputArea.appendChild(btn);
          const submit = () => {
            const val = input.value.trim();
            if (q.validate && !q.validate(val)) { addMessage(q.error, 'bot'); return; }
            addMessage(val, 'user');
            state.answers[q.id] = val;
            state.step++;
            const nextQ = questions[state.step];
            nextQ ? setTimeout(() => showQuestion(nextQ), 500) : finishChat();
          };
          btn.addEventListener('click', submit);
          input.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
        } else if (q.type === 'buttons') {
          const div = document.createElement('div'); div.className = 'flex flex-wrap gap-2';
          q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt.label; btn.className = 'btn btn-secondary text-sm';
            btn.addEventListener('click', () => {
              addMessage(opt.label, 'user');
              state.answers[q.id] = opt.value;
              state.step++;
              const nextQ = questions[state.step];
              nextQ ? setTimeout(() => showQuestion(nextQ), 500) : finishChat();
            });
            div.appendChild(btn);
          });
          inputArea.appendChild(div);
        }
      }

      async function finishChat() {
        addMessage('✨ Processando...', 'bot');
        try {
          const cep = state.answers.cep;
          const endereco = await buscarEnderecoPorCEP(cep);
          const coords = await buscarCoordenadas(endereco);
          if (!coords) throw new Error('Coordenadas não encontradas');
          const tarifa = parseFloat(state.answers.tarifa);
          const consumoHistorico = state.answers.historico.split(',').map(Number);
          const { irradMensal } = await obterIrradiacaoReal(coords.lat, coords.lon);
          const resultado = calcularSistemaDetalhado({
            consumoHistorico, tarifa, irradMensal, tipoLigacao: state.answers.ligacao
          });
          resultado.cliente = {
            nome: state.answers.nome,
            email: state.answers.email,
            endereco: `${endereco.logradouro}, ${endereco.bairro} - ${endereco.localidade}/${endereco.uf}`,
            cep
          };
          telaResultado(resultado);
        } catch (e) {
          addMessage('Erro. Tente novamente.', 'bot');
        }
      }

      showQuestion(questions[0]);
    }

    // ========== TELA DE RESULTADO ==========
    function telaResultado(d) {
      app.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <h2 class="text-3xl font-bold">📈 Resultado</h2>
          <div class="grid md:grid-cols-3 gap-6">
            <div class="card">
              <h3 class="font-semibold">Sistema</h3>
              <p>${d.potenciaReal.toFixed(2)} kWp</p>
              <p>${d.numeroModulos}x 550W</p>
              <p>${d.inversor}</p>
              <p class="text-xl font-bold text-yellow-600">R$ ${d.investimento.toFixed(2)}</p>
            </div>
            <div class="card">
              <h3 class="font-semibold">Economia (1º ano)</h3>
              <p>Mensal: R$ ${d.econMensal.toFixed(2)}</p>
              <p>Anual: R$ ${d.econAnual.toFixed(2)}</p>
              <p>Payback: ${d.payback} anos</p>
              <p>VPL: R$ ${d.vpl}</p>
            </div>
            <div class="card text-center">
              <h3 class="font-semibold">Resumo</h3>
              <p class="text-3xl font-bold text-green-500">${d.payback} anos</p>
              <p class="text-sm">Economia 25a: R$ ${d.economiasAnuais.reduce((a,b)=>a+b,0).toFixed(2)}</p>
            </div>
          </div>
          <div class="card"><canvas id="grafico" height="200"></canvas></div>
          <div class="card">
            <h3 class="font-semibold mb-4">Calculadora de Financiamento</h3>
            <div class="grid md:grid-cols-4 gap-4">
              <div><label class="text-sm">Valor (R$)</label><input id="valorFinanciado" type="number" value="${d.investimento.toFixed(2)}" class="input-field"></div>
              <div><label class="text-sm">Prazo (meses)</label><input id="prazoFinanciamento" type="number" value="60" class="input-field"></div>
              <div><label class="text-sm">Juros/mês (%)</label><input id="jurosFinanciamento" type="number" value="1.8" step="0.01" class="input-field"></div>
              <div class="flex items-end"><button id="calcularFinanciamento" class="btn btn-primary w-full">Calcular</button></div>
            </div>
            <div id="resultadoFinanciamento" class="mt-4 hidden">
              <p><strong>Parcela:</strong> <span id="valorParcela" class="text-xl font-bold text-green-600"></span></p>
              <p class="text-xs">CET aprox. <span id="cetEstimado"></span>% a.a.</p>
            </div>
          </div>
          <div class="flex gap-4">
            <button id="reiniciarBtn" class="btn btn-secondary flex-1">Nova Simulação</button>
            <button id="pdfBtn" class="btn btn-success flex-1">Baixar PDF</button>
          </div>
        </div>`;

      new Chart(document.getElementById('grafico'), {
        type:'bar', data:{ labels:MESES, datasets:[
          { label:'Geração', data:d.geracaoMensal, backgroundColor:'#facc15' },
          { label:'Consumo', data:d.consumoHistorico, backgroundColor:'#94a3b8' }
        ]}
      });

      document.getElementById('calcularFinanciamento').addEventListener('click', () => {
        const valor = +document.getElementById('valorFinanciado').value;
        const prazo = +document.getElementById('prazoFinanciamento').value;
        const juros = +document.getElementById('jurosFinanciamento').value;
        if (isNaN(valor)||isNaN(prazo)||isNaN(juros)||prazo<=0||juros<0) return alert('Preencha corretamente.');
        const parcela = calcularParcela(valor, prazo, juros);
        document.getElementById('resultadoFinanciamento').classList.remove('hidden');
        document.getElementById('valorParcela').textContent = 'R$ '+parcela;
        document.getElementById('cetEstimado').textContent = (juros/100*12*1.8*100).toFixed(2);
      });

      document.getElementById('reiniciarBtn').addEventListener('click', telaInicial);
      document.getElementById('pdfBtn').addEventListener('click', () => {
        const dadosFin = {
          valor: +document.getElementById('valorFinanciado')?.value,
          prazo: +document.getElementById('prazoFinanciamento')?.value,
          juros: +document.getElementById('jurosFinanciamento')?.value,
          parcela: document.getElementById('valorParcela')?.textContent
        };
        gerarPDF(d, dadosFin);
      });
    }

    function gerarPDF(d, dadosFinanciamento) {
      const doc = new window.jspdf.jsPDF();
      doc.setFontSize(18); doc.text('Sant\'Ana Solar - Proposta Técnica', 15, 20);
      doc.setFontSize(12);
      if (d.endereco) doc.text(`Cliente: ${d.endereco}`, 15, 30);
      doc.text(`Potência: ${d.potenciaReal.toFixed(2)} kWp`, 15, 40);
      doc.text(`Investimento: R$ ${d.investimento.toFixed(2)}`, 15, 48);
      doc.text(`Economia mensal: R$ ${d.econMensal.toFixed(2)}`, 15, 56);
      doc.text(`Payback: ${d.payback} anos | VPL: R$ ${d.vpl}`, 15, 64);
      doc.autoTable({ startY:70, head:[['Item','Qtd','Un']], body:d.bom.map(i=>[i.item,i.qtd,i.un]) });
      if (dadosFinanciamento?.valor) {
        const y = doc.lastAutoTable.finalY + 10;
        doc.text(`Parcela: ${dadosFinanciamento.parcela} em ${dadosFinanciamento.prazo}x (${dadosFinanciamento.juros}% a.m.)`, 15, y);
      }
      doc.save('proposta-santana-solar.pdf');
    }

    telaInicial();
  </script>
</body>
</html>
