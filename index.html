<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sant'Ana Solar - Plataforma Inteligente de Energia Solar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/jspdf@2/dist/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card { @apply bg-white rounded-xl shadow-lg p-6; }
    .btn-primary { @apply bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 px-6 rounded-full transition-all transform hover:scale-105; }
    .btn-secondary { @apply bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-6 rounded-full transition-all; }
    .btn-success { @apply bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-full transition-all; }
    .input-field { @apply w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-yellow-400 focus:border-transparent outline-none; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
  <div id="root"></div>

  <script>
    // ============================================
    // DADOS SOLARIMÉTRICOS REAIS (kWh/m²/dia)
    // ============================================
    const IRRADIACAO_CIDADES = {
      'São Paulo': [5.2, 5.3, 4.9, 4.5, 3.9, 3.6, 3.9, 4.5, 4.8, 5.0, 5.3, 5.2],
      'Rio de Janeiro': [5.8, 6.0, 5.4, 4.8, 4.2, 3.9, 4.2, 4.8, 5.0, 5.2, 5.6, 5.8],
      'Belo Horizonte': [5.5, 5.8, 5.2, 4.8, 4.3, 4.0, 4.3, 4.9, 5.2, 5.3, 5.4, 5.5],
      'Brasília': [5.0, 5.2, 4.8, 4.6, 4.2, 4.0, 4.2, 4.8, 5.0, 5.1, 5.0, 5.0],
      'Salvador': [5.9, 6.2, 5.8, 5.2, 4.8, 4.5, 4.8, 5.2, 5.6, 5.8, 5.9, 5.9],
      'Fortaleza': [6.0, 6.2, 5.8, 5.3, 5.0, 4.8, 5.0, 5.5, 5.8, 6.0, 6.0, 6.0],
    };

    const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

    // ============================================
    // MOTOR DE CÁLCULO
    // ============================================
    function getDadosLocalidade(cidade) {
      const irradiacao = IRRADIACAO_CIDADES[cidade] || IRRADIACAO_CIDADES['São Paulo'];
      const hspMedio = irradiacao.reduce((a, b) => a + b, 0) / 12;
      return { irradiacao, hspMedio };
    }

    function dimensionarSistema(consumoMensal, hspMedio, performanceRatio = 0.78) {
      const consumoDiario = consumoMensal / 30;
      const energiaNecessaria = consumoDiario / performanceRatio;
      const potenciaPico = energiaNecessaria / hspMedio;
      const potenciaModulo = 0.55; // kWp
      const numeroModulos = Math.ceil(potenciaPico / potenciaModulo);
      const potenciaReal = numeroModulos * potenciaModulo;
      
      const irradiacaoLocal = IRRADIACAO_CIDADES['São Paulo']; // default, será sobrescrito
      const geracaoMensal = irradiacaoLocal.map(irr => 
        parseFloat((potenciaReal * irr * 30 * performanceRatio).toFixed(2))
      );

      let inversor = 'Inversor 5kW Monofásico 220V';
      if (potenciaReal > 5.5 && potenciaReal <= 8) inversor = 'Inversor 8kW Trifásico 380V';
      else if (potenciaReal > 8) inversor = 'Inversor 10kW Trifásico 380V';

      const custoEstimado = parseFloat((potenciaReal * 1000 * 3.2).toFixed(2));
      
      return { consumoMensal, hspMedio, potenciaPico, numeroModulos, potenciaReal, geracaoMensal, inversorSugerido: inversor, custoEstimado };
    }

    function calcularPayback(investimento, economiaAnual) {
      return (investimento / economiaAnual).toFixed(1);
    }

    function calcularVPL(investimento, economiaAnual, anos = 25, taxa = 0.07) {
      let vpl = -investimento;
      for (let t = 1; t <= anos; t++) vpl += economiaAnual / Math.pow(1 + taxa, t);
      return vpl.toFixed(2);
    }

    function gerarFinanciamento(investimento) {
      const opcoes = [
        { prazo: 24, juros: 0.019, banco: 'Banco Solar' },
        { prazo: 60, juros: 0.018, banco: 'Fintech Verde' },
        { prazo: 84, juros: 0.017, banco: 'Crédito Energia' },
      ];
      return opcoes.map(op => {
        const pmt = (investimento * op.juros) / (1 - Math.pow(1 + op.juros, -op.prazo));
        return {
          prazoMeses: op.prazo,
          valorParcela: pmt.toFixed(2),
          cet: (op.juros * 12 * 1.8 * 100).toFixed(2),
          banco: op.banco,
        };
      });
    }

    function gerarBOM(dim) {
      const mod = dim.numeroModulos;
      return [
        { descricao: 'Painel Solar 550W Mono PERC', qtd: mod, un: 'un' },
        { descricao: dim.inversorSugerido, qtd: 1, un: 'un' },
        { descricao: 'Cabo solar 4mm²', qtd: Math.ceil(mod * 1.5) * 2, un: 'm' },
        { descricao: 'Conectores MC4', qtd: Math.ceil(mod / 2) * 2, un: 'pares' },
        { descricao: 'String Box CC', qtd: 1, un: 'un' },
        { descricao: 'Disjuntor CA', qtd: 1, un: 'un' },
        { descricao: 'Kit aterramento', qtd: 1, un: 'kit' },
        { descricao: 'Estrutura fixação', qtd: mod, un: 'ganchos' },
      ];
    }

    // ============================================
    // COMPONENTES REACT
    // ============================================

    // Componente de gráfico com Chart.js
    function GraficoGeracao({ dadosGeracao, consumoMedio }) {
      const canvasRef = React.useRef(null);
      const chartRef = React.useRef(null);

      React.useEffect(() => {
        if (canvasRef.current) {
          if (chartRef.current) chartRef.current.destroy();
          const ctx = canvasRef.current.getContext('2d');
          chartRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: MESES,
              datasets: [
                {
                  label: 'Geração (kWh)',
                  data: dadosGeracao,
                  backgroundColor: '#facc15',
                  borderRadius: 6,
                },
                {
                  label: 'Consumo (kWh)',
                  data: Array(12).fill(consumoMedio),
                  backgroundColor: '#94a3b8',
                  borderRadius: 6,
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } },
              scales: { y: { beginAtZero: true, grid: { color: '#e2e8f0' } } }
            }
          });
        }
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [dadosGeracao, consumoMedio]);

      return React.createElement('div', { className: 'w-full h-80' },
        React.createElement('canvas', { ref: canvasRef })
      );
    }

    // Tela Inicial
    function HomePage({ onNavigate }) {
      const [consumo, setConsumo] = React.useState(500);
      const [tarifa, setTarifa] = React.useState(0.9);
      const [cidade, setCidade] = React.useState('São Paulo');

      const handleSimular = () => {
        const { irradiacao, hspMedio } = getDadosLocalidade(cidade);
        const dim = dimensionarSistema(consumo, hspMedio);
        dim.geracaoMensal = irradiacao.map(irr => parseFloat((dim.potenciaReal * irr * 30 * 0.78).toFixed(2)));
        dim.custoEstimado = parseFloat((dim.potenciaReal * 1000 * 3.2).toFixed(2));
        
        const somaGeracao = dim.geracaoMensal.reduce((a, b) => a + b, 0);
        const econMensal = (somaGeracao / 12) * tarifa;
        const econAnual = econMensal * 12;
        const payback = calcularPayback(dim.custoEstimado, econAnual);
        const vpl = calcularVPL(dim.custoEstimado, econAnual);
        const financiamento = gerarFinanciamento(dim.custoEstimado);
        const bom = gerarBOM(dim);

        onNavigate('viabilidade', {
          dimensionamento: dim,
          economia: { mensal: econMensal, anual: econAnual, payback, vpl },
          financiamento,
          bom,
          cidade,
          tarifa
        });
      };

      return React.createElement('main', { className: 'min-h-screen flex items-center justify-center px-4 py-8' },
        React.createElement('div', { className: 'max-w-2xl w-full space-y-8' },
          React.createElement('div', { className: 'text-center' },
            React.createElement('h1', { className: 'text-4xl font-extrabold text-gray-900 mb-2' }, '☀️ Sant'Ana Solar'),
            React.createElement('p', { className: 'text-lg text-gray-600' }, 'Simule seu sistema solar em segundos.')
          ),
          React.createElement('div', { className: 'card space-y-4' },
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Cidade'),
              React.createElement('select', { value: cidade, onChange: e => setCidade(e.target.value), className: 'input-field' },
                Object.keys(IRRADIACAO_CIDADES).map(c => React.createElement('option', { key: c, value: c }, c))
              )
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Consumo médio mensal (kWh)'),
              React.createElement('input', { type: 'number', value: consumo, onChange: e => setConsumo(Number(e.target.value)), className: 'input-field' })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Tarifa de energia (R$/kWh)'),
              React.createElement('input', { type: 'number', step: '0.01', value: tarifa, onChange: e => setTarifa(Number(e.target.value)), className: 'input-field' })
            ),
            React.createElement('button', { onClick: handleSimular, className: 'btn-primary w-full' }, 'Simular Proposta')
          )
        )
      );
    }

    // Tela de Viabilidade
    function ViabilidadePage({ data, onNavigate }) {
      const { dimensionamento, economia, cidade } = data;
      
      return React.createElement('main', { className: 'min-h-screen py-8 px-4' },
        React.createElement('div', { className: 'max-w-6xl mx-auto space-y-8' },
          React.createElement('div', { className: 'flex justify-between items-center' },
            React.createElement('h1', { className: 'text-3xl font-bold' }, '📈 Estudo de Viabilidade'),
            React.createElement('span', { className: 'text-gray-500' }, cidade)
          ),
          
          React.createElement('div', { className: 'grid md:grid-cols-3 gap-6' },
            React.createElement('div', { className: 'card' },
              React.createElement('h3', { className: 'text-lg font-semibold mb-2' }, 'Sistema Projetado'),
              React.createElement('p', null, 'Potência: ', React.createElement('strong', null, `${dimensionamento.potenciaReal.toFixed(2)} kWp`)),
              React.createElement('p', null, 'Módulos: ', React.createElement('strong', null, `${dimensionamento.numeroModulos}x 550W`)),
              React.createElement('p', null, 'Inversor: ', React.createElement('strong', null, dimensionamento.inversorSugerido)),
              React.createElement('p', { className: 'mt-2 text-xl font-bold text-yellow-600' }, `R$ ${dimensionamento.custoEstimado.toFixed(2)}`)
            ),
            React.createElement('div', { className: 'card' },
              React.createElement('h3', { className: 'text-lg font-semibold mb-2' }, 'Economia'),
              React.createElement('p', null, 'Mensal: ', React.createElement('strong', null, `R$ ${economia.mensal.toFixed(2)}`)),
              React.createElement('p', null, 'Anual: ', React.createElement('strong', null, `R$ ${economia.anual.toFixed(2)}`)),
              React.createElement('p', null, 'Payback: ', React.createElement('strong', null, `${economia.payback} anos`)),
              React.createElement('p', null, 'VPL (25a): ', React.createElement('strong', null, `R$ ${economia.vpl}`))
            ),
            React.createElement('div', { className: 'card' },
              React.createElement('h3', { className: 'text-lg font-semibold mb-2' }, 'Resumo Financeiro'),
              React.createElement('p', { className: 'text-sm text-gray-600' }, 'Investimento se paga em'),
              React.createElement('p', { className: 'text-3xl font-bold text-green-500' }, `${economia.payback} anos`),
              React.createElement('p', { className: 'text-sm text-gray-600 mt-2' }, 'Economia total em 25 anos'),
              React.createElement('p', { className: 'text-2xl font-bold text-green-600' }, `R$ ${(economia.anual * 25).toFixed(2)}`)
            )
          ),

          React.createElement('div', { className: 'card' },
            React.createElement('h2', { className: 'text-xl font-semibold mb-4' }, 'Geração vs Consumo Mensal'),
            React.createElement(GraficoGeracao, { dadosGeracao: dimensionamento.geracaoMensal, consumoMedio: dimensionamento.consumoMensal })
          ),

          React.createElement('div', { className: 'flex gap-4' },
            React.createElement('button', { onClick: () => onNavigate('home'), className: 'btn-secondary flex-1' }, 'Nova Simulação'),
            React.createElement('button', { onClick: () => onNavigate('proposta', data), className: 'btn-primary flex-1' }, 'Ver Proposta Completa')
          )
        )
      );
    }

    // Tela de Proposta
    function PropostaPage({ data, onNavigate }) {
      const { dimensionamento, economia, financiamento, bom, cidade, tarifa } = data;

      const baixarPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.text('Proposta Comercial - Sant'Ana Solar', 15, 20);
        doc.setFontSize(12);
        doc.text(`Cidade: ${cidade}`, 15, 30);
        doc.text(`Consumo médio: ${dimensionamento.consumoMensal} kWh/mês`, 15, 38);
        doc.text(`Tarifa: R$ ${tarifa}/kWh`, 15, 46);
        doc.text('--- Sistema Projetado ---', 15, 56);
        doc.text(`Potência: ${dimensionamento.potenciaReal.toFixed(2)} kWp`, 15, 64);
        doc.text(`Módulos: ${dimensionamento.numeroModulos}x 550W`, 15, 72);
        doc.text(`Inversor: ${dimensionamento.inversorSugerido}`, 15, 80);
        doc.text(`Investimento: R$ ${dimensionamento.custoEstimado.toFixed(2)}`, 15, 88);
        doc.text('--- Economia ---', 15, 98);
        doc.text(`Mensal: R$ ${economia.mensal.toFixed(2)} - Anual: R$ ${economia.anual.toFixed(2)}`, 15, 106);
        doc.text(`Payback: ${economia.payback} anos - VPL: R$ ${economia.vpl}`, 15, 114);
        doc.text('--- Lista de Materiais ---', 15, 124);
        bom.forEach((item, i) => doc.text(`${item.descricao}: ${item.qtd} ${item.un}`, 15, 132 + i * 8));
        doc.save('proposta-sant-ana-solar.pdf');
      };

      return React.createElement('main', { className: 'min-h-screen py-8 px-4' },
        React.createElement('div', { className: 'max-w-4xl mx-auto space-y-8' },
          React.createElement('h1', { className: 'text-3xl font-bold' }, '📄 Proposta Final'),
          
          React.createElement('div', { className: 'card' },
            React.createElement('h2', { className: 'text-xl font-semibold mb-4' }, 'Resumo do Projeto'),
            React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
              React.createElement('div', null,
                React.createElement('p', null, React.createElement('strong', null, 'Potência: '), `${dimensionamento.potenciaReal.toFixed(2)} kWp`),
                React.createElement('p', null, React.createElement('strong', null, 'Módulos: '), `${dimensionamento.numeroModulos}x 550W`),
                React.createElement('p', null, React.createElement('strong', null, 'Inversor: '), dimensionamento.inversorSugerido),
              ),
              React.createElement('div', null,
                React.createElement('p', null, React.createElement('strong', null, 'Investimento: '), `R$ ${dimensionamento.custoEstimado.toFixed(2)}`),
                React.createElement('p', null, React.createElement('strong', null, 'Economia Anual: '), `R$ ${economia.anual.toFixed(2)}`),
                React.createElement('p', null, React.createElement('strong', null, 'Payback: '), `${economia.payback} anos`),
              )
            )
          ),

          React.createElement('div', { className: 'card' },
            React.createElement('h2', { className: 'text-xl font-semibold mb-4' }, 'Lista de Materiais (BOM)'),
            React.createElement('div', { className: 'overflow-x-auto' },
              React.createElement('table', { className: 'w-full text-left' },
                React.createElement('thead', null,
                  React.createElement('tr', { className: 'border-b' },
                    React.createElement('th', { className: 'py-2' }, 'Item'),
                    React.createElement('th', { className: 'py-2' }, 'Qtd'),
                    React.createElement('th', { className: 'py-2' }, 'Un')
                  )
                ),
                React.createElement('tbody', null,
                  bom.map((item, i) =>
                    React.createElement('tr', { key: i, className: 'border-b' },
                      React.createElement('td', { className: 'py-2' }, item.descricao),
                      React.createElement('td', { className: 'py-2' }, item.qtd),
                      React.createElement('td', { className: 'py-2' }, item.un)
                    )
                  )
                )
              )
            )
          ),

          React.createElement('div', { className: 'card' },
            React.createElement('h2', { className: 'text-xl font-semibold mb-4' }, 'Opções de Financiamento'),
            React.createElement('div', { className: 'space-y-2' },
              financiamento.map((f, i) =>
                React.createElement('div', { key: i, className: 'flex justify-between items-center p-3 bg-gray-50 rounded-lg' },
                  React.createElement('span', null, `${f.banco} - ${f.prazoMeses}x`),
                  React.createElement('span', { className: 'font-semibold' }, `R$ ${f.valorParcela}/mês (CET ${f.cet}%)`)
                )
              )
            )
          ),

          React.createElement('div', { className: 'flex gap-4' },
            React.createElement('button', { onClick: () => onNavigate('home'), className: 'btn-secondary flex-1' }, 'Nova Simulação'),
            React.createElement('button', { onClick: baixarPDF, className: 'btn-success flex-1' }, '📥 Baixar PDF')
          )
        )
      );
    }

    // App principal
    function App() {
      const [tela, setTela] = React.useState('home');
      const [dadosProposta, setDadosProposta] = React.useState(null);

      const navigate = (destination, data = null) => {
        if (data) setDadosProposta(data);
        setTela(destination);
      };

      if (tela === 'home') return React.createElement(HomePage, { onNavigate: navigate });
      if (tela === 'viabilidade') return React.createElement(ViabilidadePage, { data: dadosProposta, onNavigate: navigate });
      if (tela === 'proposta') return React.createElement(PropostaPage, { data: dadosProposta, onNavigate: navigate });
      return null;
    }

    // Renderização
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
