<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber Solar - Revolução Energética</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
  <script src="https://unpkg.com/jspdf@2/dist/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script>
    // ============================================
    // MOTOR DE ENGENHARIA SOLAR
    // ============================================
    const IRRADIACAO_MENSAL_SP = [5.2, 5.3, 4.9, 4.5, 3.9, 3.6, 3.9, 4.5, 4.8, 5.0, 5.3, 5.2];

    function getIrradiacaoMedia(lat, lon) {
      const soma = IRRADIACAO_MENSAL_SP.reduce((a, b) => a + b, 0);
      return soma / 12;
    }

    function dimensionarSistema(consumoMedioMensal, hspMedio, performanceRatio = 0.78) {
      const consumoDiario = consumoMedioMensal / 30;
      const energiaNecessaria = consumoDiario / performanceRatio;
      const potenciaPico = energiaNecessaria / hspMedio;
      const potenciaModulo = 0.55; // kWp
      const numeroModulos = Math.ceil(potenciaPico / potenciaModulo);
      const potenciaReal = numeroModulos * potenciaModulo;
      const geracaoMensal = IRRADIACAO_MENSAL_SP.map(irr => potenciaReal * irr * 30 * performanceRatio);
      let inversor = '';
      if (potenciaReal <= 5.5) inversor = 'Inversor 5kW Monofásico 220V';
      else if (potenciaReal <= 8) inversor = 'Inversor 8kW Trifásico 380V';
      else inversor = 'Inversor 10kW Trifásico 380V';
      const custoEstimado = potenciaReal * 1000 * 3.2;
      return {
        consumoMedioMensal, hspMedio, potenciaPico, numeroModulos, potenciaReal,
        geracaoMensal, inversorSugerido: inversor, custoEstimado
      };
    }

    // ============================================
    // MOTOR FINANCEIRO
    // ============================================
    function calcularPaybackSimples(investimento, economiaAnual) {
      return investimento / economiaAnual;
    }

    function calcularVPL(investimento, economiaAnual, anos = 25, taxa = 0.07) {
      let vpl = -investimento;
      for (let t = 1; t <= anos; t++) {
        vpl += economiaAnual / Math.pow(1 + taxa, t);
      }
      return vpl;
    }

    function gerarOpcoesFinanciamento(investimento) {
      const opcoes = [
        { prazo: 24, taxaJurosAoMes: 0.019, banco: 'Banco Solar' },
        { prazo: 60, taxaJurosAoMes: 0.018, banco: 'Fintech Verde' },
        { prazo: 84, taxaJurosAoMes: 0.017, banco: 'Crédito Energia' },
      ];
      return opcoes.map(op => {
        const pmt = (investimento * op.taxaJurosAoMes) / (1 - Math.pow(1 + op.taxaJurosAoMes, -op.prazo));
        return {
          prazoMeses: op.prazo,
          valorParcela: +pmt.toFixed(2),
          cet: +(op.taxaJurosAoMes * 12 * 1.8 * 100).toFixed(2),
          banco: op.banco,
        };
      });
    }

    // ============================================
    // GERADOR DE LISTA DE MATERIAIS (BOM)
    // ============================================
    function gerarBOM(dim) {
      const mod = dim.numeroModulos;
      return [
        { descricao: 'Painel Solar 550W Mono PERC', quantidade: mod, unidade: 'un' },
        { descricao: dim.inversorSugerido, quantidade: 1, unidade: 'un' },
        { descricao: 'Cabo solar preto 4mm²', quantidade: Math.ceil(mod * 1.5), unidade: 'm' },
        { descricao: 'Cabo solar vermelho 4mm²', quantidade: Math.ceil(mod * 1.5), unidade: 'm' },
        { descricao: 'Conectores MC4', quantidade: 2 * Math.ceil(mod / 2), unidade: 'pares' },
        { descricao: 'String Box CC com DPS', quantidade: 1, unidade: 'un' },
        { descricao: 'Disjuntor CA 32A', quantidade: 1, unidade: 'un' },
        { descricao: 'DPS classe II CA', quantidade: 1, unidade: 'un' },
        { descricao: 'Kit de aterramento', quantidade: 1, unidade: 'kit' },
        { descricao: 'Ganchos para telhado cerâmico', quantidade: mod, unidade: 'un' },
        { descricao: 'Trilho de alumínio', quantidade: Math.ceil(mod * 1.2), unidade: 'm' },
      ];
    }

    // ============================================
    // COMPONENTES REACT (criados com createElement)
    // ============================================

    // Tela de Upload
    function UploadConta({ onPropostaGerada }) {
      const [consumo, setConsumo] = React.useState(500);
      const [tarifa, setTarifa] = React.useState(0.9);
      const [loading, setLoading] = React.useState(false);

      const gerarProposta = () => {
        setLoading(true);
        // Simula processamento interno (tudo síncrono)
        const hsp = getIrradiacaoMedia(-23.5, -46.6);
        const dim = dimensionarSistema(consumo, hsp);
        const somaGeracao = dim.geracaoMensal.reduce((a, b) => a + b, 0);
        const economiaMensal = (somaGeracao / 12) * tarifa;
        const economiaAnual = economiaMensal * 12;
        const payback = calcularPaybackSimples(dim.custoEstimado, economiaAnual);
        const vpl = calcularVPL(dim.custoEstimado, economiaAnual);
        const financiamento = gerarOpcoesFinanciamento(dim.custoEstimado);
        const bom = gerarBOM(dim);
        
        const proposta = {
          dimensionamento: dim,
          economia: { mensal: economiaMensal, anual: economiaAnual, payback, vpl },
          financiamento,
          bom
        };
        setLoading(false);
        onPropostaGerada(proposta);
      };

      return React.createElement('main', { className: 'flex flex-col items-center justify-center min-h-screen px-4' },
        React.createElement('h1', { className: 'text-3xl font-bold mb-2' }, '☀️ Uber Solar'),
        React.createElement('p', { className: 'text-gray-600 mb-8' }, 'A revolução da energia solar começa aqui.'),
        React.createElement('div', { className: 'bg-white p-6 rounded-xl shadow-md w-full max-w-md space-y-4' },
          React.createElement('div', null,
            React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Consumo médio mensal (kWh)'),
            React.createElement('input', {
              type: 'number', value: consumo,
              onChange: e => setConsumo(Number(e.target.value)),
              className: 'w-full border border-gray-300 rounded-lg p-2'
            })
          ),
          React.createElement('div', null,
            React.createElement('label', { className: 'block text-sm font-medium mb-1' }, 'Tarifa de energia (R$/kWh)'),
            React.createElement('input', {
              type: 'number', step: '0.01', value: tarifa,
              onChange: e => setTarifa(Number(e.target.value)),
              className: 'w-full border border-gray-300 rounded-lg p-2'
            })
          ),
          React.createElement('button', {
            onClick: gerarProposta, disabled: loading,
            className: 'w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 rounded-full transition'
          }, loading ? 'Calculando...' : 'Simular Proposta')
        )
      );
    }

    // Tela de Viabilidade com Gráfico
    function Viabilidade({ proposta, onVerProposta }) {
      const { dimensionamento, economia } = proposta;
      const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      const dadosGrafico = dimensionamento.geracaoMensal.map((v, i) => ({
        mes: meses[i],
        'Geração (kWh)': +v.toFixed(0),
        'Consumo (kWh)': dimensionamento.consumoMedioMensal,
      }));

      // Recharts exige componentes específicos
      const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

      return React.createElement('main', { className: 'container mx-auto px-4 py-8 max-w-4xl' },
        React.createElement('h1', { className: 'text-2xl font-bold mb-6' }, '📈 Estudo de Viabilidade'),
        // Card Sistema
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Sistema Projetado'),
          React.createElement('p', null, 'Potência: ', React.createElement('strong', null, `${dimensionamento.potenciaReal.toFixed(2)} kWp`)),
          React.createElement('p', null, 'Módulos: ', React.createElement('strong', null, `${dimensionamento.numeroModulos}x 550W`)),
          React.createElement('p', null, 'Inversor: ', React.createElement('strong', null, dimensionamento.inversorSugerido)),
          React.createElement('p', null, 'Investimento: ', React.createElement('strong', null, `R$ ${dimensionamento.custoEstimado.toFixed(2)}`))
        ),
        // Gráfico
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Geração vs Consumo Mensal'),
          React.createElement(ResponsiveContainer, { width: '100%', height: 300 },
            React.createElement(BarChart, { data: dadosGrafico },
              React.createElement(CartesianGrid, { strokeDasharray: '3 3' }),
              React.createElement(XAxis, { dataKey: 'mes' }),
              React.createElement(YAxis, null),
              React.createElement(Tooltip, null),
              React.createElement(Legend, null),
              React.createElement(Bar, { dataKey: 'Geração (kWh)', fill: '#facc15' }),
              React.createElement(Bar, { dataKey: 'Consumo (kWh)', fill: '#94a3b8' })
            )
          )
        ),
        // Indicadores financeiros
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Indicadores Financeiros'),
          React.createElement('p', null, 'Economia Mensal: ', React.createElement('strong', null, `R$ ${economia.mensal.toFixed(2)}`)),
          React.createElement('p', null, 'Economia Anual: ', React.createElement('strong', null, `R$ ${economia.anual.toFixed(2)}`)),
          React.createElement('p', null, 'Payback: ', React.createElement('strong', null, `${economia.payback.toFixed(1)} anos`)),
          React.createElement('p', null, 'VPL (25 anos): ', React.createElement('strong', null, `R$ ${economia.vpl.toFixed(2)}`))
        ),
        // Botão próxima tela
        React.createElement('button', {
          onClick: onVerProposta,
          className: 'w-full bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 rounded-full transition'
        }, 'Ver Proposta Completa')
      );
    }

    // Tela de Proposta Final
    function Proposta({ proposta, onVoltar }) {
      const { dimensionamento, economia, bom, financiamento } = proposta;

      const handleDownloadPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.text('Proposta Comercial - Uber Solar', 10, 10);
        doc.setFontSize(12);
        doc.text(`Potência: ${dimensionamento.potenciaReal.toFixed(2)} kWp`, 10, 20);
        doc.text(`Módulos: ${dimensionamento.numeroModulos}x 550W`, 10, 30);
        doc.text(`Inversor: ${dimensionamento.inversorSugerido}`, 10, 40);
        doc.text(`Investimento: R$ ${dimensionamento.custoEstimado.toFixed(2)}`, 10, 50);
        doc.text(`Economia anual: R$ ${economia.anual.toFixed(2)}`, 10, 60);
        doc.text(`Payback: ${economia.payback.toFixed(1)} anos`, 10, 70);
        doc.text('--- Lista de Materiais ---', 10, 80);
        bom.forEach((item, i) => {
          doc.text(`${item.descricao} - ${item.quantidade} ${item.unidade}`, 10, 90 + i * 7);
        });
        doc.save('proposta-uber-solar.pdf');
      };

      return React.createElement('main', { className: 'container mx-auto px-4 py-8 max-w-4xl' },
        React.createElement('h1', { className: 'text-2xl font-bold mb-6' }, '📄 Proposta Final'),
        // Resumo
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Resumo do Projeto'),
          React.createElement('p', null, React.createElement('strong', null, 'Potência: '), `${dimensionamento.potenciaReal.toFixed(2)} kWp`),
          React.createElement('p', null, React.createElement('strong', null, 'Módulos: '), `${dimensionamento.numeroModulos}x 550W`),
          React.createElement('p', null, React.createElement('strong', null, 'Inversor: '), dimensionamento.inversorSugerido),
          React.createElement('p', null, React.createElement('strong', null, 'Investimento: '), `R$ ${dimensionamento.custoEstimado.toFixed(2)}`)
        ),
        // BOM
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Lista de Materiais (BOM)'),
          React.createElement('ul', { className: 'space-y-1' },
            bom.map((item, i) =>
              React.createElement('li', { key: i, className: 'flex justify-between' },
                React.createElement('span', null, item.descricao),
                React.createElement('span', { className: 'text-gray-600' }, `${item.quantidade} ${item.unidade}`)
              )
            )
          )
        ),
        // Financiamento
        React.createElement('div', { className: 'bg-white rounded-xl shadow-md p-6 mb-6' },
          React.createElement('h2', { className: 'text-lg font-semibold mb-2' }, 'Opções de Financiamento'),
          financiamento.map((f, i) =>
            React.createElement('div', { key: i, className: 'border-b last:border-0 py-2 flex justify-between' },
              React.createElement('span', null, `${f.banco} - ${f.prazoMeses}x`),
              React.createElement('span', { className: 'font-semibold' }, `R$ ${f.valorParcela}/mês (CET ${f.cet}%)`)
            )
          )
        ),
        // Botões
        React.createElement('div', { className: 'flex gap-4' },
          React.createElement('button', {
            onClick: handleDownloadPDF,
            className: 'flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-full transition'
          }, 'Baixar Proposta em PDF'),
          React.createElement('button', {
            onClick: onVoltar,
            className: 'flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-3 rounded-full transition'
          }, 'Nova Simulação')
        )
      );
    }

    // App principal com roteamento simples
    function App() {
      const [tela, setTela] = React.useState('upload');
      const [proposta, setProposta] = React.useState(null);

      const handlePropostaGerada = (prop) => {
        setProposta(prop);
        setTela('viabilidade');
      };

      if (tela === 'upload') {
        return React.createElement(UploadConta, { onPropostaGerada: handlePropostaGerada });
      } else if (tela === 'viabilidade') {
        return React.createElement(Viabilidade, {
          proposta: proposta,
          onVerProposta: () => setTela('proposta')
        });
      } else if (tela === 'proposta') {
        return React.createElement(Proposta, {
          proposta: proposta,
          onVoltar: () => setTela('upload')
        });
      }
      return null;
    }

    // Renderiza a aplicação no elemento root
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
